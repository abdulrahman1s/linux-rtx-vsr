[package]
name = "linux-rtx-vsr"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Local NVIDIA VideoSuperRes for Chromium on Linux"
license = "MIT"
repository = "https://github.com/abdulrahman1s/linux-rtx-vsr"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
libloading = "0.8"
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.28"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
