# Adapted from abdulrahman1s/qsh; see licenses/qsh-MIT.txt.
name: Build and Release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Create a release after all checks pass
        type: boolean
        default: false
      bump:
        description: Version bump (auto uses conventional commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: Explicit MAJOR.MINOR.PATCH, overriding bump
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
env:
  CARGO_TERM_COLOR: always
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - id: plan
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_RELEASE: ${{ inputs.release }}
          INPUT_BUMP: ${{ inputs.bump || 'auto' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: bun scripts/release-plan.ts
  build:
    needs: plan
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: needs.plan.outputs.commit == 'true'
        run: bun scripts/set-version.ts "$VERSION"
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check && bun run check && bun test
      - run: bun node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Browser failure and recovery checks (no GPU)
        run: bun run test:browser
      - run: cargo +stable build --locked --release
      - run: bun scripts/package.ts
      - run: bun tests/archive-smoke.ts
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rtx-vsr-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
  nix:
    needs: plan
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - if: needs.plan.outputs.commit == 'true'
        run: bun scripts/set-version.ts "$VERSION"
      - uses: cachix/install-nix-action@v31
      - run: nix fmt -- --check flake.nix nix/*.nix
      - run: nix flake check --print-build-logs
      - run: nix build --print-build-logs
  release:
    needs: [plan, build, nix]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/download-artifact@v5
        with:
          name: linux-rtx-vsr-${{ env.VERSION }}
          path: dist
      - name: Commit tested versions and create tag
        if: needs.plan.outputs.commit == 'true'
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || { echo 'Branch advanced; rerun on its new head.'; exit 1; }
          bun scripts/set-version.ts "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock extension/manifest.json package.json
          git commit -m "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "refs/tags/v$VERSION"
      - name: Publish checked archives and generated notes
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          cd ..
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
          else
            gh release create "v$VERSION" dist/* --verify-tag --generate-notes --title "Linux RTX VSR v$VERSION"
          fi
